name: 宁好 · 抓取、分析与发布

# 两个阶段：
# - 私有仓库（现在）：只在 Actions 页面手动运行，结果存回仓库，不发布网站。
# - 公开上线：① 删掉下面 schedule 两行开头的 #，打开每 30 分钟定时播报；
#            ② 在 Settings → Secrets and variables → Actions → Variables 里加 NINGHAO_PAGES = true，发布到 GitHub Pages。
# 私有仓库先不开定时：免费账号的私有仓库每月只有 2000 分钟 Actions 额度，每 30 分钟跑一次会超。
on:
  # schedule:
  #   - cron: "*/30 * * * *"   # 每 30 分钟检查一次新消息（GitHub 可能延迟几分钟）
  workflow_dispatch:          # 在 Actions 页面手动点一下即可立即运行
  push:
    branches: [main]
    paths: ["site/**", "config/**", "ninghao/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ninghao
  cancel-in-progress: false

jobs:
  update:
    # push 只用来重新发布网站，没开 Pages 时直接跳过
    if: github.event_name != 'push' || vars.NINGHAO_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并让大模型分析
        if: github.event_name != 'push'
        env:
          # 用哪家模型：仓库变量 NINGHAO_PROVIDER，不设就是 gemini（免费）
          NINGHAO_PROVIDER: ${{ vars.NINGHAO_PROVIDER || 'gemini' }}
          NINGHAO_MODEL: ${{ vars.NINGHAO_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python -m ninghao.run

      - name: 把新情报存回仓库
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "播报更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: vars.NINGHAO_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.NINGHAO_PAGES == 'true'
        with:
          path: site

  deploy:
    needs: update
    if: vars.NINGHAO_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
