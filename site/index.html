<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宁好 · 海外能源情报</title>
<meta name="description" content="以宁德时代海外业务视角解读储能、AI 数据中心与新能源政策的实时情报（个人作品集项目）">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230052D9'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif'%3E宁%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="wrap header-inner">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true">宁</span>
      <span class="brand-name">宁好</span>
      <span class="brand-sub">宁德时代海外业务 · 实时情报</span>
    </a>
    <div class="status" id="live"><i class="dot"></i><span id="live-text">加载中…</span></div>
  </div>
</header>

<main class="wrap layout">
  <aside class="filters" aria-label="筛选">
    <div class="f-group">
      <h2 class="f-title">分类</h2>
      <ul class="cats" id="cats"></ul>
    </div>
    <div class="f-group">
      <h2 class="f-title">信号</h2>
      <div class="seg" id="signals" role="group" aria-label="信号">
        <button data-signal="" class="on">全部</button>
        <button data-signal="机会">机会</button>
        <button data-signal="风险">风险</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="important"> 只看重要（影响 ≥ 4）</label>
  </aside>

  <section class="content">
    <input class="search" id="search" type="search" placeholder="搜索公司、项目或政策，如 FEOC、PJM、Tesla" aria-label="搜索">
    <p class="count" id="count"></p>
    <section id="hero" class="featured" hidden></section>
    <section id="feed" class="list" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>暂无符合条件的情报。</p>
  </section>
</main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-backdrop" data-close></div>
  <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-headline">
    <button class="drawer-close" data-close aria-label="关闭">✕</button>
    <div id="drawer-body"></div>
  </article>
</aside>

<div id="toast" class="toast" hidden></div>

<footer class="footer wrap">
  <p>宁好是个人作品集项目，基于公开信息，不代表宁德时代官方立场。标题与解读由 AI 生成，可能有误，请以原文为准；配图版权归原媒体所有。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
